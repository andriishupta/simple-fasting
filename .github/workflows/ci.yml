name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: App quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Content check
        run: |
          pnpm content:sync
          pnpm content:check
        working-directory: app
      - name: Typecheck
        run: pnpm exec tsc --noEmit
        working-directory: app
      - name: Lint
        run: pnpm lint
        working-directory: app
      - name: Unit tests
        run: pnpm test:unit
        working-directory: app

  www-quality:
    name: Website quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: www
      - name: Content check
        run: |
          pnpm content:sync
          pnpm content:check
        working-directory: www
      - name: Build
        run: pnpm run build
        working-directory: www

  app-integration:
    name: App integration tests
    runs-on: ubuntu-latest
    needs: app-quality
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm test:integration
        working-directory: app

  app-coverage:
    name: App coverage
    runs-on: ubuntu-latest
    needs: app-quality
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm test:coverage
        working-directory: app
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: app-coverage
          path: app/coverage
          if-no-files-found: ignore

  platform-bundle:
    name: ${{ matrix.platform }} bundle
    runs-on: ubuntu-latest
    needs: [app-integration, app-coverage, www-quality]
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm content:sync
        working-directory: app
      - name: Export ${{ matrix.platform }} bundle
        run: pnpm exec expo export --platform ${{ matrix.platform }} --output-dir /tmp/simple-fasting-${{ matrix.platform }}
        working-directory: app
