name: Native E2E

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - app/**
      - docs/**
      - scripts/sync-shared-content.mjs

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  build_android:
    name: Build Android E2E app
    type: build
    params:
      platform: android
      profile: e2e-test

  build_ios:
    name: Build iOS E2E app
    type: build
    params:
      platform: ios
      profile: e2e-test

  test_android:
    name: Test Android flows
    needs: [build_android]
    type: maestro
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path:
        - .maestro/onboarding-skip.yml
        - .maestro/fasting-lifecycle.yml
        - .maestro/settings-and-legal.yml
        - .maestro/goals.yml
        - .maestro/custom-goal-manage.yml
        - .maestro/open-ended-and-data.yml
        - .maestro/open-ended-complete.yml
        - .maestro/planned-fast-cancel.yml
        - .maestro/data-views.yml
        - .maestro/history-edit-delete.yml
        - .maestro/history-bulk-delete.yml
        - .maestro/clear-data.yml
        - .maestro/settings-preferences.yml
        - .maestro/report-bug.yml

  test_ios:
    name: Test iOS flows
    needs: [build_ios]
    type: maestro
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path:
        - .maestro/onboarding-skip.yml
        - .maestro/fasting-lifecycle.yml
        - .maestro/settings-and-legal.yml
        - .maestro/goals.yml
        - .maestro/custom-goal-manage.yml
        - .maestro/open-ended-and-data.yml
        - .maestro/open-ended-complete.yml
        - .maestro/planned-fast-cancel.yml
        - .maestro/data-views.yml
        - .maestro/history-edit-delete.yml
        - .maestro/history-bulk-delete.yml
        - .maestro/clear-data.yml
        - .maestro/settings-preferences.yml
        - .maestro/report-bug.yml
