appId: app.simplefasting
name: Cancel a planned fast without saving history
---
- launchApp:
    clearState: true
- tapOn: I agree to the Terms of Use and Privacy Policy
- tapOn: Agree and Continue
- tapOn: Not Now
- assertVisible: 16:8
- tapOn: Start fast
- assertVisible: Cancel fast
- tapOn: Cancel fast
- assertVisible: Cancel fast?
- tapOn: Cancel Fast
- assertVisible: Start fast
- tapOn: Data
- assertVisible: Finish at least one fast
