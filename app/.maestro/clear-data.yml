appId: app.simplefasting
name: Clear local data after confirming destructive prompt
---
- launchApp:
    clearState: true
- tapOn: I agree to the Terms of Use and Privacy Policy
- tapOn: Agree and Continue
- tapOn: Not Now
- tapOn: Start fast
- tapOn: End fast
- tapOn: Settings
- scrollUntilVisible:
    element: Clear data
    direction: DOWN
- tapOn: Clear data
- assertVisible: Clear all data?
- tapOn: 'No'
- tapOn: Data
- tapOn: History
- assertVisible: 1 completed fast
- tapOn: Settings
- scrollUntilVisible:
    element: Clear data
    direction: DOWN
- tapOn: Clear data
- assertVisible: Clear all data?
- tapOn: Yes, Delete
- assertVisible: Start fast
- tapOn: Data
- assertVisible: Finish at least one fast
